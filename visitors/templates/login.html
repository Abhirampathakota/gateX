{% extends 'base.html' %}
{% block content %}

<style>
    /* Premium Liquid Glass Card */
    .liquid-login-card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 40px;
        box-shadow: 
            0 25px 50px -12px rgba(0, 0, 0, 0.1),
            inset 0 0 20px rgba(255, 255, 255, 0.1);
        padding: 4rem 3rem;
        transition: all 0.4s ease;
    }

    /* Refractive Input Fields */
    .glass-input {
        background: rgba(255, 255, 255, 0.4) !important;
        border: 1px solid rgba(255, 255, 255, 0.3) !important;
        border-radius: 18px !important;
        padding: 18px 25px !important;
        color: #1e293b !important;
        font-weight: 500;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
    }

    .glass-input::placeholder {
        color: rgba(30, 41, 59, 0.5);
    }

    .glass-input:focus {
        background: rgba(255, 255, 255, 0.6) !important;
        border-color: #1e293b !important;
        box-shadow: 0 0 15px rgba(30, 41, 59, 0.1) !important;
        outline: none;
    }

    /* Secure Login Button */
    .btn-secure-login {
        background: #1e293b;
        color: #ffffff;
        border-radius: 20px;
        padding: 18px;
        font-weight: 700;
        font-size: 1.1rem;
        border: none;
        box-shadow: 0 10px 25px rgba(30, 41, 59, 0.2);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-secure-login:hover {
        background: #0f172a;
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(30, 41, 59, 0.3);
    }

    /* Icon Styling */
    .login-icon-badge {
        background: #3b82f6;
        width: 45px;
        height: 45px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        margin: 0 auto 2rem;
        color: white;
        box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
    }
</style>

<div class="row justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="col-md-5">
        <div class="liquid-login-card">
            
            <div class="login-icon-badge">
                <i class="bi bi-shield-lock-fill"></i>
            </div>

            <h2 class="fw-bold mb-2" style="color: #1e293b; font-size: 2.5rem; letter-spacing: -1px;">Visitor Login</h2>
            <p class="text-muted mb-5" style="font-size: 1.1rem;">Please enter your secure credentials to proceed.</p>
            
            {% if error_message %}
            <div class="alert alert-danger border-0 shadow-sm mb-4" role="alert" style="background: rgba(239, 68, 68, 0.15); color: #b91c1c; font-weight: 600; border-radius: 15px;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error_message }}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="text" name="username" class="form-control glass-input" placeholder="Roll Number" required>
                </div>
                <div class="mb-4">
                    <input type="password" name="password" class="form-control glass-input" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-secure-login w-100">
                    Secure Login ➔
                </button>
            </form>

            <div class="mt-5 text-center">
                <p class="text-muted">Problem logging in? <a href="#" class="text-primary fw-bold text-decoration-none">Contact Security</a></p>
            </div>
            
        </div>
    </div>
</div>

{% endblock %}
